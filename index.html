<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HỆ THỐNG GHI LƯƠNG - CCCD BẢO MẬT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Text:wght@400;700&display=swap');
        
        body {margin:0;padding:0;font-family: 'SF Pro Text', sans-serif;background: linear-gradient(135deg,#f0f0f5 0%,#d9d9d9 100%);display:flex;justify-content:center;align-items:flex-start;padding:20px; padding-bottom: 120px; transition: background 0.3s;-webkit-font-smoothing:antialiased; box-sizing: border-box; min-height: 100vh;}
        body.dark { background: #1a1a1a; color: #eee; }
        
        .app-container {background: rgba(255, 255, 255, 0.85); backdrop-filter: saturate(180%) blur(20px); border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.12); padding:40px 28px 28px 28px; max-width:420px; width:100%; color:#142a51; box-sizing:border-box; position: relative; margin-top: 10px;}
        body.dark .app-container { background: rgba(40, 40, 40, 0.95); color: #fff; }
        
        #themeToggle { position: absolute; top: 15px; right: 15px; border: none; background: rgba(0,0,0,0.05); width: 35px; height: 35px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; z-index: 100;}
        body.dark #themeToggle { background: rgba(255,255,255,0.1); }
        
        h1 {margin:0 0 10px 0;font-weight:700;font-size:1.4rem;text-align:center; text-transform: uppercase;}
        .field {margin-bottom:12px;}
        label {display:block;margin-bottom:4px;font-weight:600;font-size:0.85rem;}
        
        input, select {width:100%;padding:10px 14px;font-size:1rem;border:1px solid #ddd;border-radius:12px;background: #fff;box-sizing:border-box; outline: none; transition: background 0.3s, color 0.3s;}
        
        /* Fix lỗi lóa mắt ở Dark Mode cho các ô readonly */
        body.dark input, body.dark select { background: #333 !important; color: #fff !important; border-color: #444; }
        input[readonly] { background: #f0f0f0; cursor: not-allowed; }
        body.dark input[readonly] { background: #333 !important; color: #bbb !important; }

        #calam { color: #008000; font-weight: 700; border: 2px solid #008000; }
        body.dark #calam { color: #00ff00; border-color: #00ff00; }

        .time-group {display:flex;gap:8px;}
        .time-group > div {flex:1;}
        
        button {cursor:pointer;font-weight:700;font-size:1rem;border:none;border-radius:12px;padding:12px 0; transition: 0.3s;}
        #btn-save {background-color:#4cd964;color:white; width: 48%;}
        #btn-reset {background-color:#ff3b30;color:white; width: 48%;}
        #btn-show-history {background-color:#fff;color:#142a51;border-radius:16px;padding:12px 0;width:100%;margin-top:12px;font-weight:700;box-shadow:0 2px 8px rgb(0 0 0 / 0.12); border: 1px solid #ddd;}
        
        /* Lịch sử */
        #lichsu-container {margin-top:20px; border-radius:20px; max-height:600px; overflow-y:auto;}
        .history-card { background: #fff; border: 1px solid #eee; border-radius: 15px; padding: 15px; margin-bottom: 15px; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        body.dark .history-card { background: #252525; border-color: #333; }
        .history-card .date-header { font-weight: bold; font-size: 0.95rem; margin-bottom: 8px; border-bottom: 1px solid #f0f0f0; padding-bottom: 6px; }
        body.dark .history-card .date-header { border-bottom-color: #444; }
        .history-delete { position: absolute; top: 10px; right: 10px; background:#ff3b30; color:white; border:none; border-radius: 50%; width: 24px; height: 24px; cursor:pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; }
        
        .company-line { font-size: 0.85rem; font-weight: bold; display: flex; align-items: center; gap: 5px; margin-top: 5px; margin-bottom: 10px;}
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 0.85rem; color: #555; background: #f9f9f9; padding: 8px; border-radius: 8px; }
        body.dark .details-grid { color: #ccc; background: #333; }

        #footer-credit {text-align:center;margin-top:25px;font-size:0.75rem;color:#888; display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap;}
        .hidden {display:none !important;}

        .footer-trust { position: fixed; bottom: 0; left: 0; width: 100%; background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); padding: 15px 0; text-align: center; box-shadow: 0 -4px 15px rgba(0,0,0,0.08); z-index: 1000; }
        body.dark .footer-trust { background-color: rgba(30, 30, 30, 0.95); }
        .footer-trust img { height: 60px; width: auto; }
        
        /* Auth UI */
        .auth-form { text-align: center; }
        .btn-auth { width: 100%; background: #007aff; color: white; margin-top: 10px; }
        .link-auth { display: block; margin-top: 15px; font-size: 0.8rem; color: #007aff; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>

<button id="themeToggle">🌙</button>

<div id="login-screen" class="app-container">
    <div class="auth-form">
        <h2>Đăng Nhập</h2>
        <div class="field"><label>Số CCCD</label><input type="text" id="login-cccd" placeholder="Nhập 12 số CCCD"></div>
        <div class="field"><label>Mật khẩu</label><input type="password" id="login-pass" placeholder="******"></div>
        <button class="btn-auth" onclick="handleLogin()">ĐĂNG NHẬP</button>
        <span class="link-auth" onclick="showAuth('register-screen')">Đăng ký bằng CCCD mới</span>
        <span class="link-auth" onclick="showAuth('forgot-screen')">Quên mật khẩu?</span>
    </div>
</div>

<div id="register-screen" class="app-container hidden">
    <div class="auth-form">
        <h2>Đăng Ký Hệ Thống</h2>
        <div class="field"><label>Họ và Tên</label><input type="text" id="reg-name" placeholder="NGUYỄN VĂN A"></div>
        <div class="field"><label>Số CCCD</label><input type="text" id="reg-cccd" placeholder="Dùng để đăng nhập"></div>
        <div class="field"><label>Mã ID Nhân Viên</label><input type="text" id="reg-id" placeholder="Ví dụ: PVH221202"></div>
        <div class="field"><label>Mật khẩu</label><input type="password" id="reg-pass" placeholder="******"></div>
        <button class="btn-auth" style="background:#4cd964" onclick="handleRegister()">TẠO TÀI KHOẢN</button>
        <span class="link-auth" onclick="showAuth('login-screen')">Quay lại Đăng nhập</span>
    </div>
</div>

<div id="forgot-screen" class="app-container hidden">
    <div class="auth-form">
        <h2>Lấy Lại Mật Khẩu</h2>
        <div class="field"><label>Số CCCD</label><input type="text" id="forgot-cccd"></div>
        <div class="field"><label>Mã ID Nhân viên chính xác</label><input type="text" id="forgot-id"></div>
        <div class="field"><label>Mật khẩu mới</label><input type="password" id="forgot-new-pass"></div>
        <button class="btn-auth" style="background:#ff3b30" onclick="handleResetPass()">CẬP NHẬT MẬT KHẨU</button>
        <span class="link-auth" onclick="showAuth('login-screen')">Quay lại</span>
    </div>
</div>

<div id="app" class="app-container hidden">
    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span style="font-size: 0.7rem; color: #888;">User: <b id="user-display" style="color:#007aff"></b></span>
        <button onclick="handleLogout()" style="background:none; color:red; border:none; font-size:0.7rem; text-decoration:underline; cursor:pointer;">Đăng xuất</button>
    </div>

    <h1 data-text="title">GHI CHÉP LƯƠNG</h1>
    
    <select id="lang-select" style="margin-bottom:15px;">
        <option value="vi">Tiếng Việt</option>
        <option value="en">English</option>
        <option value="zh">中文</option>
    </select>

    <div id="form-ghi">
        <div class="field"><label data-text="label_name">Họ và Tên</label><input type="text" id="hoten" readonly></div>
        <div class="field"><label data-text="label_id">Mã ID</label><input type="text" id="maid" readonly></div>
        <div class="field"><label data-text="label_date">Ngày</label><input type="date" id="ngay"></div>
        <div class="field">
            <label data-text="label_shift">Chọn ca làm</label>
            <select id="calam">
                <option value="day" data-text-option="shift_day">Ca ngày (8h-20h)</option>
                <option value="night" data-text-option="shift_night">Ca đêm (20h-8h)</option>
            </select>
        </div>
        <div class="field"><label data-text="label_company">Tên công ty</label><input type="text" id="tencongty"></div>
        <div class="field"><label data-text="label_dept">Bộ phận</label><input type="text" id="bophan" placeholder="..."></div>

        <div class="time-group">
            <div><label data-text="label_start_time_short">Vào</label>
                <div style="display:flex; gap:4px;"><input type="number" id="gv_h" value="8"> : <input type="number" id="gv_p" value="0"></div>
            </div>
            <div><label data-text="label_end_time_short">Ra</label>
                <div style="display:flex; gap:4px;"><input type="number" id="gr_h" value="17"> : <input type="number" id="gr_p" value="0"></div>
            </div>
        </div>

        <div class="time-group" style="margin-top:10px;">
            <div><label data-text="label_total_hours">Tổng giờ</label><input type="text" id="res_tong" readonly></div>
            <div><label data-text="label_overtime">Tăng ca</label><input type="text" id="res_tc" readonly></div>
        </div>
        
        <div style="display:flex; justify-content:space-between; margin-top:15px;">
            <button id="btn-save" data-text="btn_save">Lưu</button>
            <button id="btn-reset" data-text="btn_reset">Reset</button>
        </div>
        <button id="btn-show-history" data-text="btn_show_history">Xem chi tiết lịch sử</button>
    </div>

    <div id="lichsu-container" class="hidden">
        <h2 data-text="history_title">LỊCH SỬ CHI TIẾT</h2>
        <div id="lichsu-list"></div>
        <button id="btn-clear" data-text="btn_clear_history" style="width:100%; background:#ff3b30; color:white; margin-top:10px; border-radius:12px; padding:10px; border:none; font-weight:700;">Xóa lịch sử</button>
        <button id="btn-back" data-text="btn_back" style="width:100%; background:#4cd964; color:white; margin-top:10px; border-radius:12px; padding:10px; border:none; font-weight:700;">Quay lại</button>
    </div>

    <div id="footer-credit">
        <span data-text="footer_text">Một sản phẩm của :</span>
        <strong>PHẠM VĂN HÒA PRIORITY</strong>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M7.75738 11.7976C7.37538 11.3986 6.74338 11.3826 6.34338 11.7646C5.94438 12.1456 5.92838 12.7786 6.31038 13.1786L9.4665 16.1912C9.6545 16.3882 9.9145 16.5002 10.1865 16.5012H10.1905C10.4615 16.5012 10.7205 16.3912 10.9085 16.1962L17.6855 9.19624C18.0695 8.79924 18.0595 8.16624 17.6625 7.78224C17.2645 7.39724 16.6315 7.40924 16.2485 7.80524L10.1955 14.0582L7.75738 11.7976ZM12.0004 2.00146C6.47738 2.00146 2.00038 6.47846 2.00038 12.0015C2.00038 17.5235 6.47738 22.0015 12.0004 22.0015C17.5234 22.0015 22.0004 17.5235 22.0004 12.0015C22.0004 6.47846 17.5234 2.00146 12.0004 2.00146Z" fill="#00BC3C"></path></svg>
    </div>
</div>

<footer class="footer-trust">
    <a href="https://tinnhiemmang.vn/" target="_blank" rel="noopener noreferrer">
        <img src="https://tinnhiemmang.vn/storage/photos/shares/CetificateTrust/sys_pre_nca.png" alt="Tin Nhiệm Mạng">
    </a>
</footer>

<script>
// QUẢN LÝ TÀI KHOẢN
let currentUserCCCD = null;
let currentUserName = "";
let currentUserID = "";

const texts = {
    vi: { title:"GHI CHÉP LƯƠNG", label_name:"Họ và Tên", label_id:"Mã ID", label_company:"Tên công ty", label_dept:"Bộ phận", label_date:"Ngày", label_shift:"Chọn ca làm", shift_day:"Ca ngày", shift_night:"Ca đêm", label_start_time_short:"Vào", label_end_time_short:"Ra", label_total_hours:"Tổng giờ", label_overtime:"Tăng ca", btn_save:"Lưu", btn_reset:"Reset", btn_show_history:"Xem chi tiết lịch sử", history_title:"LỊCH SỬ CHI TIẾT", no_history:"Chưa có dữ liệu.", btn_clear_history:"Xóa lịch sử", btn_back:"Quay lại", label_dept_display: "Bộ phận : ", label_company_display: "Tên công ty : ", footer_text: "Một sản phẩm của :", vao: "Vào", ra: "Ra", tong: "Tổng", tc: "TC" },
    en: { title:"WORK LOG", label_name:"Full Name", label_id:"ID Code", label_company:"Company", label_dept:"Dept", label_date:"Date", label_shift:"Shift", shift_day:"Day Shift", shift_night:"Night Shift", label_start_time_short:"In", label_end_time_short:"Out", label_total_hours:"Total", label_overtime:"OT", btn_save:"Save", btn_reset:"Reset", btn_show_history:"View History", history_title:"HISTORY", no_history:"No data.", btn_clear_history:"Clear All", btn_back:"Back", label_dept_display: "Dept : ", label_company_display: "Company : ", footer_text: "A product of :", vao: "In", ra: "Out", tong: "Total", tc: "OT" },
    zh: { title:"工资记录", label_name:"姓名", label_id:"工号", label_company:"公司", label_dept:"部门", label_date:"日期", label_shift:"班次", shift_day:"白班", shift_night:"夜班", label_start_time_short:"入", label_end_time_short:"出", label_total_hours:"工时", label_overtime:"加班", btn_save:"保存", btn_reset:"重置", btn_show_history:"历史", history_title:"历史详情", no_history:"无数据", btn_clear_history:"清除", btn_back:"返回", label_dept_display: "部门 : ", label_company_display: "公司 : ", footer_text: "产品来自 :", vao: "入", ra: "出", tong: "总计", tc: "加班" }
};

let currentLang = 'vi';
const checkIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;"><path fill-rule="evenodd" clip-rule="evenodd" d="M7.75738 11.7976C7.37538 11.3986 6.74338 11.3826 6.34338 11.7646C5.94438 12.1456 5.92838 12.7786 6.31038 13.1786L9.4665 16.1912C9.6545 16.3882 9.9145 16.5002 10.1865 16.5012H10.1905C10.4615 16.5012 10.7205 16.3912 10.9085 16.1962L17.6855 9.19624C18.0695 8.79924 18.0595 8.16624 17.6625 7.78224C17.2645 7.39724 16.6315 7.40924 16.2485 7.80524L10.1955 14.0582L7.75738 11.7976ZM12.0004 2.00146C6.47738 2.00146 2.00038 6.47846 2.00038 12.0015C2.00038 17.5235 6.47738 22.0015 12.0004 22.0015C17.5234 22.0015 22.0004 17.5235 22.0004 12.0015C22.0004 6.47846 17.5234 2.00146 12.0004 2.00146Z" fill="#00BC3C"></path></svg>`;

function showAuth(id) {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('register-screen').classList.add('hidden');
    document.getElementById('forgot-screen').classList.add('hidden');
    document.getElementById('app').classList.add('hidden');
    document.getElementById(id).classList.remove('hidden');
}

function handleRegister() {
    const name = document.getElementById('reg-name').value.trim();
    const cccd = document.getElementById('reg-cccd').value.trim();
    const id = document.getElementById('reg-id').value.trim();
    const pass = document.getElementById('reg-pass').value;
    if(!name || !cccd || !id || !pass) return alert("Vui lòng nhập đủ thông tin!");
    let users = JSON.parse(localStorage.getItem('salary_users_v3') || "[]");
    if(users.find(u => u.cccd === cccd)) return alert("CCCD này đã tồn tại!");
    users.push({name, cccd, id, pass});
    localStorage.setItem('salary_users_v3', JSON.stringify(users));
    alert("Đăng ký thành công!");
    showAuth('login-screen');
}

function handleLogin() {
    const cccd = document.getElementById('login-cccd').value.trim();
    const pass = document.getElementById('login-pass').value;
    let users = JSON.parse(localStorage.getItem('salary_users_v3') || "[]");
    const found = users.find(u => u.cccd === cccd && u.pass === pass);
    if(found) {
        currentUserCCCD = cccd;
        currentUserName = found.name;
        currentUserID = found.id;
        document.getElementById('user-display').innerText = cccd;
        document.getElementById('hoten').value = found.name;
        document.getElementById('maid').value = found.id;
        document.getElementById('ngay').valueAsDate = new Date();
        showAuth('app');
        calculate();
    } else { alert("Sai CCCD hoặc mật khẩu!"); }
}

function handleResetPass() {
    const cccd = document.getElementById('forgot-cccd').value.trim();
    const id = document.getElementById('forgot-id').value.trim();
    const newPass = document.getElementById('forgot-new-pass').value;
    let users = JSON.parse(localStorage.getItem('salary_users_v3') || "[]");
    let idx = users.findIndex(u => u.cccd === cccd && u.id === id);
    if(idx !== -1) {
        users[idx].pass = newPass;
        localStorage.setItem('salary_users_v3', JSON.stringify(users));
        alert("Đã cập nhật mật khẩu!");
        showAuth('login-screen');
    } else { alert("Thông tin xác minh không khớp!"); }
}

function handleLogout() { currentUserCCCD = null; showAuth('login-screen'); }

function calculate() {
    let v_h = parseInt(document.getElementById('gv_h').value) || 0;
    let v_p = parseInt(document.getElementById('gv_p').value) || 0;
    let r_h = parseInt(document.getElementById('gr_h').value) || 0;
    let r_p = parseInt(document.getElementById('gr_p').value) || 0;
    let totalMin = (r_h * 60 + r_p) - (v_h * 60 + v_p);
    if (totalMin < 0) totalMin += 1440;
    let totalHours = totalMin / 60;
    let tc = totalHours > 9 ? totalHours - 9 : 0;
    document.getElementById('res_tong').value = totalHours.toFixed(2) + "h";
    document.getElementById('res_tc').value = tc.toFixed(2) + "h";
}

function getHistory() {
    let all = JSON.parse(localStorage.getItem("salary_data_v8") || "{}");
    return all[currentUserCCCD] || [];
}

function saveHistory(data) {
    let all = JSON.parse(localStorage.getItem("salary_data_v8") || "{}");
    all[currentUserCCCD] = data;
    localStorage.setItem("salary_data_v8", JSON.stringify(all));
}

function renderHistory() {
    const box = document.getElementById('lichsu-list');
    box.innerHTML = "";
    let data = getHistory();
    const t = texts[currentLang];
    if(data.length === 0) {
        box.innerHTML = `<p style="text-align:center; padding:20px; color:#888;">${t.no_history}</p>`;
        return;
    }
    [...data].reverse().forEach((item, index) => {
        const originalIndex = data.length - 1 - index;
        const card = document.createElement('div');
        card.className = "history-card";
        card.innerHTML = `
            <button class="history-delete" onclick="deleteItem(${originalIndex})">✖</button>
            <div class="date-header">${item.ngay}</div>
            <div style="font-weight:700; font-size:0.9rem;">${item.name} | ID: ${item.id}</div>
            <div style="color:green; font-weight:700; font-size:0.8rem;">${item.calam==='day'?t.shift_day:t.shift_night}</div>
            <div style="font-size:0.85rem;">${t.label_dept_display}${item.bophan || '...'}</div>
            <div class="company-line"><span>${t.label_company_display}${item.cty}</span> ${checkIcon}</div>
            <div class="details-grid">
                <span>${t.vao}: ${item.giovao}</span><span>${t.tong}: ${item.tong}</span>
                <span>${t.ra}: ${item.giora}</span><span>${t.tc}: ${item.tc}</span>
            </div>
        `;
        box.appendChild(card);
    });
}

document.getElementById('btn-save').onclick = function() {
    const cty = document.getElementById('tencongty').value;
    const ngay = document.getElementById('ngay').value;
    if(!cty || !ngay) return alert("Nhập đủ Ngày và Công ty!");
    let data = getHistory();
    data.push({
        name: currentUserName, id: currentUserID, ngay, cty, bophan: document.getElementById('bophan').value,
        giovao: document.getElementById('gv_h').value + ":" + document.getElementById('gv_p').value.toString().padStart(2,'0'),
        giora: document.getElementById('gr_h').value + ":" + document.getElementById('gr_p').value.toString().padStart(2,'0'),
        tong: document.getElementById('res_tong').value, tc: document.getElementById('res_tc').value,
        calam: document.getElementById('calam').value
    });
    saveHistory(data);
    alert("Đã lưu thành công!");
};

window.deleteItem = (i) => { if(confirm("Xóa?")) { let d = getHistory(); d.splice(i,1); saveHistory(d); renderHistory(); } };
document.getElementById('btn-show-history').onclick = () => { document.getElementById('form-ghi').classList.add('hidden'); document.getElementById('lichsu-container').classList.remove('hidden'); renderHistory(); };
document.getElementById('btn-back').onclick = () => { document.getElementById('form-ghi').classList.remove('hidden'); document.getElementById('lichsu-container').classList.add('hidden'); };
document.getElementById('btn-clear').onclick = () => { if(confirm("Xóa hết?")) { saveHistory([]); renderHistory(); } };
document.getElementById('themeToggle').onclick = () => document.body.classList.toggle('dark');
["gv_h", "gv_p", "gr_h", "gr_p"].forEach(id => document.getElementById(id).addEventListener("input", calculate));
document.getElementById('calam').onchange = function() {
    if(this.value === 'day') { document.getElementById('gv_h').value = 8; document.getElementById('gr_h').value = 17; }
    else { document.getElementById('gv_h').value = 20; document.getElementById('gr_h').value = 5; }
    calculate();
};
document.getElementById('lang-select').onchange = function() {
    currentLang = this.value;
    document.querySelectorAll("[data-text]").forEach(el => {
        const key = el.getAttribute("data-text");
        if(texts[currentLang][key]) el.textContent = texts[currentLang][key];
    });
    renderHistory();
};
</script>
</body>
</html>
